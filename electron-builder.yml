appId: com.ultrasystemmonitor.app
productName: Ultra System Monitor
copyright: Copyright © 2026 AiCMS.BD — Freeware

directories:
  output: release
  buildResources: assets

files:
  - dist/**
  - dist-electron/**
  - package.json

# assets/icon.png (512×512) is auto-converted to .ico / .icns per platform.
icon: assets/icon.png

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: UltraSystemMonitor-Setup-${version}.exe

# Microsoft Store package (unsigned; the Store signs it on publication).
# Replace identityName/publisher with your Partner Center "Product identity"
# values after reserving the app name, then run: npm run dist:store
appx:
  identityName: AiCMSBD.UltraSystemMonitor
  publisher: CN=REPLACE-WITH-PARTNER-CENTER-PUBLISHER-ID
  publisherDisplayName: AiCMS.BD
  backgroundColor: '#0a0e27'

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Ultra System Monitor
  runAfterFinish: true

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: System
  synopsis: Real-time system monitoring sidebar
  artifactName: UltraSystemMonitor-${version}-${arch}.${ext}

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.utilities
  artifactName: UltraSystemMonitor-${version}-${arch}.${ext}
